name: Build and deploy to server

on:
  # Deploy when code changes are pushed to GitHub
  push:
    branches: [master]
  # Deploy instantly when the content this site is built from changes.
  #
  #   wordpress_update - the WP plugin in wordpress-plugin/ fires this on every
  #                      publish.
  #   course_update    - the DLC platform (learn.tokoacademy.org) fires this when
  #                      a course is created, edited, published or unpublished.
  #
  # Course data is read from the DLC API at BUILD time (src/lib/dlc.ts), so a
  # price or a title edited in the admin only reaches visitors when this runs.
  # Before course_update existed such an edit waited for the nightly build, and
  # on 2026-10-07, when that build failed, it waited thirty hours.
  repository_dispatch:
    types: [wordpress_update, course_update]
  # Once-a-day safety net (06:17 UTC) in case a WordPress webhook is ever missed.
  schedule:
    - cron: '17 6 * * *'
  # Manual "Run workflow" button in the Actions tab
  workflow_dispatch:

# Queue deploys instead of running two at once; never cancel a deploy mid-upload
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The only thing this workflow needs from GitHub is the right to read its own
# code. Everything that touches production goes over SSH with a deploy key, not
# with GITHUB_TOKEN. Stating that here means a compromised dependency pulled in
# by `npm ci` cannot use the job's token to push code or open releases, whatever
# the repository's default token permissions happen to be.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag. A tag is a movable label: if
      # an action's repository were ever compromised, `@v7` would quietly start
      # running new code — inside a job that holds the production SSH key.
      # A commit hash cannot be moved. Update these deliberately.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN sitting in .git/config for the rest of the
          # job. Nothing after this step talks to GitHub over git.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (fetches fresh WordPress content)
        run: npm run build

      # A build that produced nothing is not a deploy, it is an outage waiting
      # to be rsynced. Stop here rather than upload a half-written tree.
      - name: Verify the build actually produced a site
        run: |
          test -s out/index.html || { echo "out/index.html is missing or empty — refusing to deploy" >&2; exit 1; }
          pages=$(find out -name 'index.html' | wc -l)
          echo "exported $pages page(s)"
          [ "$pages" -ge 10 ] || { echo "only $pages page(s) exported — that is not a complete build" >&2; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # umask first: the key file is never briefly world-readable.
          ( umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key )
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Pinned host key. The runner then refuses to hand the deploy key to
            # anything that is not the real server.
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Fallback: trust whatever answers on the day. This is how the
            # workflow has always behaved; set the SSH_KNOWN_HOSTS secret to
            # stop trusting a stranger who answers on the server's address.
            echo "::warning::SSH_KNOWN_HOSTS is not set — accepting the host key unverified (see docs/SECURITY-REVIEW.md)"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      # Additive deploy: uploads/overwrites this site's files only.
      # NEVER add --delete here — public_html contains other sites that must not be touched.
      - name: Deploy out/ to server (additive rsync, no delete)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          upload() {
            # --chmod pins what lands on the server (dirs 755, files 644) instead
            # of inheriting whatever umask the runner happened to have, so a
            # world-writable file can never be published by accident.
            rsync -avz --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
              out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          }
          # Retry up to 3 times so a one-off network/SSH blip self-heals
          # instead of failing the run (and emailing a false alarm).
          n=1
          until upload; do
            if [ "$n" -ge 3 ]; then
              echo "rsync failed after $n attempts" >&2
              exit 1
            fi
            echo "rsync attempt $n failed — retrying in 10s..."
            n=$((n + 1))
            sleep 10
          done

  # ---------------------------------------------------------------------
  # A failed deploy used to be silent: the site just stopped updating and
  # nothing said so. On 2026-10-07 that cost thirty hours. This sends the
  # failure to the Telegram group, which is where these are actually read.
  #
  # It goes through scripts/telegram-alert.sh, the same file the deliberate
  # test in alert-test.yml uses — a test that exercised a different code path
  # would prove nothing about this one.
  #
  # If the secrets are missing or Telegram refuses, this job goes RED with the
  # reason. An alert that silently fails to send is worse than none, because
  # the quiet feels like good news.
  # ---------------------------------------------------------------------
  notify-failure:
    needs: build-and-deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tell Telegram the website stopped updating
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          {
            echo "<b>tokoacademy.org did not deploy</b>"
            echo
            echo "The site is still serving the previous build. Anything edited since then - a course price, a title, a page - is not visible to visitors."
            echo
            echo "Course data is read from the DLC API at build time, so the catalogue on the website stays frozen at the last good build until this is fixed."
            echo
            echo "Triggered by: $TRIGGER"
            echo "Run: $RUN_URL"
          } | bash scripts/telegram-alert.sh
