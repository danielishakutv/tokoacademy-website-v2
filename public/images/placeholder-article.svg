<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Toko Academy">
  <!--
    Shown where a WordPress post has no featured image.

    It used to fall back to /images/hero/professional-courses.jpg — a real
    photograph of a real class — which meant that on the home page the same
    picture appeared three times: once in the hero and again for each event
    without its own image. A repeated photograph reads as a mistake, and it
    quietly devalues the photograph itself.

    So the fallback is now obviously not a photograph. It is brand-coloured
    and abstract, it weighs about a kilobyte, and it says "no picture here"
    without pretending otherwise.
  -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A7C2A" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#2196F3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4A7C2A" stop-opacity="0.20"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#4A7C2A" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#F7F8F7"/>
  <rect width="1200" height="675" fill="url(#wash)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <circle cx="250" cy="170" r="240" fill="#4A7C2A" fill-opacity="0.07"/>
  <circle cx="980" cy="540" r="200" fill="#2196F3" fill-opacity="0.06"/>

  <g transform="translate(600 337.5)" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text y="6" font-size="34" font-weight="700" fill="#4A7C2A" fill-opacity="0.55" letter-spacing="0.14em">TOKO ACADEMY</text>
    <text y="44" font-size="19" font-weight="500" fill="#52595F" fill-opacity="0.55" letter-spacing="0.02em">Skills for Tomorrow</text>
  </g>
</svg>
